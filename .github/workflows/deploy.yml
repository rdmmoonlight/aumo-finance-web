name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Mengatur izin token GITHUB_TOKEN agar dapat melakukan deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah konflik jika ada beberapa deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- [OPSIONAL: JIKA MENGGUNAKAN BLAZOR WASM / .NET] ---
      # Hapus tanda komentar (#) pada baris di bawah jika proyek Anda adalah Blazor WebAssembly:
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.0.x'
      #
      # - name: Publish Blazor WASM
      #   run: dotnet publish -c Release -o release
      # -----------------------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tentukan folder output web Anda. 
          # - Jika HTML/JS biasa: gunakan '.' (root repository)
          # - Jika Blazor WASM: ubah menjadi 'release/wwwroot'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
