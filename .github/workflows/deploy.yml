name: C# Code Quality & GitHub Pages Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Memungkinkan pemicuan manual dari tab Actions

permissions:
  contents: write    # Diperlukan agar runner dapat melakukan auto-commit jika format berubah
  pages: write       # Diperlukan untuk deployment ke GitHub Pages
  id-token: write    # Diperlukan untuk autentikasi OIDC ke GitHub Pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: Auto-Format & Quality Check
  # ==========================================
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Sesuaikan dengan versi SDK proyek Anda (.NET 8/9/10)

      - name: Restore Dependencies
        run: dotnet restore

      # 1. Otomatis rapikan spasi, tab, dan format kode
      - name: Auto-Format Code
        run: dotnet format

      # 2. Commit & push otomatis jika ada file yang dikoreksi
      - name: Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct code formatting via dotnet format"

      # 3. Build & Check Code Quality (Strict Warning as Errors)
      - name: Build & Run Roslyn Analyzers
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true

  # ==========================================
  # JOB 2: Build & Deploy Blazor WASM ke Pages
  # ==========================================
  deploy-pages:
    needs: lint-and-format # Berjalan HANYA SETELAH Job 1 sukses selesai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Pastikan versi sama dengan Job 1

      - name: Publish Blazor WASM App
        run: dotnet publish -c Release -o release

      - name: Fix Base Href & Prevent Jekyll Processing
        run: |
          # Buat file .nojekyll agar folder _framework tidak terblokir GitHub Pages
          touch release/wwwroot/.nojekyll
          
          # Ubah base href khusus untuk repo aumo-finance-web
          sed -i 's/<base href="\/" \/>/<base href="\/aumo-finance-web\/" \/>/g' release/wwwroot/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
