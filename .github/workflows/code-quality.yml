name: C# Code Quality & Formatting Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Diizinkan agar runner dapat melakukan commit/push perbaikan format

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }} # Memastikan ref tepat saat dipicu PR/Push

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      # -------------------------------------------------------------
      # 1. LINT (Auto-Format Code)
      # -------------------------------------------------------------
      - name: Auto-Format Code
        run: dotnet format

      - name: Commit Formatted Changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct code formatting via dotnet format [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # -------------------------------------------------------------
      # 2. TYPECHECK & LINT (Build & Strict Roslyn Analyzers)
      # -------------------------------------------------------------
      - name: Build & Typecheck (.NET)
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true

      # -------------------------------------------------------------
      # 3. MICROFRONTENDS CONFIG PRESENT (Pencarian Otomatis)
      # -------------------------------------------------------------
      - name: Verify microfrontends.json Present
        run: |
          # Cari file microfrontends.json di seluruh workspace, abaikan folder temporary/build biasa
          FILE_PATH=$(find . -name "microfrontends.json" -not -path "*/node_modules/*" -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
          
          if [ -n "$FILE_PATH" ]; then
            echo "✅ microfrontends.json ditemukan di lokasi: $FILE_PATH"
          else
            echo "❌ ERROR: microfrontends.json tidak ditemukan di seluruh workspace!"
            exit 1
          fi
