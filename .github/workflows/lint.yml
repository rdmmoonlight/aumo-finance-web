name: C# Code Quality & Formatting Check

on:
  push:
    branches: [ main ]

# Diubah ke write agar runner diizinkan melakukan commit/push perbaikan format
permissions:
  contents: write

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    # 1. Otomatis rapikan spasi, tab, dan format kode
    - name: Auto-Format Code
      run: dotnet format

    # 2. Commit & push otomatis jika ada file yang dikoreksi
    - name: Commit Formatted Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-correct code formatting via dotnet format"

    # 3. Build & Check Code Quality (Strict Warning as Errors)
    - name: Build & Run Roslyn Analyzers
      run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
