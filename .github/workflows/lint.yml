name: C# Code Quality & Formatting Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write # Mengizinkan auto-commit jika ada format kode yang perlu diperbaiki

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    # 1. Rapikan kode secara otomatis jika ada yang berantakan
    - name: Format Code
      run: dotnet format

    # 2. Commit & Push otomatis jika dotnet format mengubah file
    - name: Commit & Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-format code via dotnet format [skip ci]"

    # 3. Build & Check Code Quality
    - name: Build & Run Roslyn Analyzers
      run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
