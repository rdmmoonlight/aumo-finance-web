name: C# Code Quality & Formatting Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Diizinkan agar runner dapat melakukan commit/push perbaikan format

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Menggunakan .NET 10 sesuai proyek Anda

      - name: Restore Dependencies
        run: dotnet restore

      # 1. Otomatis rapikan spasi, tab, dan format kode
      - name: Auto-Format Code
        run: dotnet format

      # 2. Commit & push otomatis jika ada file yang dikoreksi.
      # Ditambahkan [skip render] dan [skip ci] agar tidak memicu/membatalkan deploy Render.
      - name: Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct code formatting via dotnet format [skip render] [skip ci]"

      # 3. Verifikasi ulang bahwa format kode sudah rapi
      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      # 4. Build & Check Code Quality (Strict Warning as Errors)
      - name: Build & Run Roslyn Analyzers
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
