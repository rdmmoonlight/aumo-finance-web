name: C# Code Quality & Formatting Check

on:
  push:
    branches: [ main ]

# Cukup izin read karena CI tidak akan melakukan commit lagi
permissions:
  contents: read

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    # 1. Cek kerapian kode. Parameter --verify-no-changes akan membuat step ini GAGAL jika ada kode yang tidak rapi
    - name: Verify Code Format
      run: dotnet format --verify-no-changes

    # 2. Build & Check Code Quality (Strict Warning as Errors)
    - name: Build & Run Roslyn Analyzers
      run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
