name: Deploy ASP.NET Core MVC (Production)

on:
  push:
    branches:
      - production

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Wajib untuk membuat Tag & Release di GitHub

    steps:
    # 1. Checkout repository (fetch-depth: 0 wajib agar riwayat commit terbaca untuk pemversian)
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Kalkulasi Versi Otomatis Berdasarkan Commit Log
    - name: Bump Version and Push Tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch

    # 3. Setup .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Sesuaikan dengan versi target .NET aplikasi Anda

    # 4. Publish MVC App (Sambil inject versi ke DLL Assembly)
    - name: Publish MVC Web App
      run: >
        dotnet publish
        -c Release
        -o ./publish
        -p:Version=${{ steps.tag_version.outputs.new_version }}
        -p:AssemblyVersion=${{ steps.tag_version.outputs.new_version }}
        -p:FileVersion=${{ steps.tag_version.outputs.new_version }}

    # 5. Buat GitHub Release Otomatis (Lengkap dengan Changelog)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        body: ${{ steps.tag_version.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
